<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ache o Tatu!</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#7ec8f2;
    font-family:'Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;
  }
  #game{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;}

  #hud{
    position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:12px 16px;pointer-events:none;z-index:5;
  }
  .pill{
    background:rgba(255,255,255,.9);border-radius:999px;padding:8px 22px;
    font-size:clamp(18px,4.5vw,30px);font-weight:800;
    box-shadow:0 4px 0 rgba(0,0,0,.12);
  }
  #scorePill{color:#e07a00;}
  #levelPill{color:#2b7a3f;}

  #sound{
    position:fixed;left:14px;bottom:14px;width:58px;height:58px;border-radius:50%;
    border:none;background:rgba(255,255,255,.9);font-size:26px;z-index:6;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.12);line-height:1;
  }
  #sound:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12);}

  #banner{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity .25s;z-index:8;
  }
  #banner.show{opacity:1;}
  #banner span{
    font-size:clamp(38px,12vw,92px);font-weight:900;color:#fff;
    text-shadow:0 6px 0 #ff9f1c, 0 0 34px rgba(255,210,0,.9);
    transform:scale(.5);transition:transform .35s cubic-bezier(.2,1.7,.4,1);
    letter-spacing:2px;
  }
  #banner.show span{transform:scale(1);}

  .overlay{
    position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;
    padding:7vh 6vw 9vh;background:rgba(255,255,255,.12);
  }
  .overlay.hide{display:none;}
  .overlay h1{
    font-size:clamp(34px,10vw,74px);color:#fff;margin:0;text-align:center;
    text-shadow:0 5px 0 #e07a00, 0 9px 20px rgba(0,0,0,.25);
  }
  .overlay p{
    font-size:clamp(15px,4.2vw,26px);color:#4a2f1c;background:rgba(255,255,255,.88);
    padding:12px 24px;border-radius:22px;margin:16px 0 0;text-align:center;
    max-width:620px;box-shadow:0 4px 0 rgba(0,0,0,.1);
  }
  #play{
    font-family:inherit;font-size:clamp(26px,7vw,46px);font-weight:900;color:#fff;
    background:linear-gradient(180deg,#ffb703,#f77f00);border:none;border-radius:999px;
    padding:18px 62px;box-shadow:0 9px 0 #c05a00;cursor:pointer;letter-spacing:2px;
  }
  #play:active{transform:translateY(6px);box-shadow:0 3px 0 #c05a00;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="pill" id="scorePill">⭐ <span id="pts">0</span></div>
  <div class="pill" id="levelPill">Fase <span id="lvl">1</span></div>
</div>

<button id="sound" aria-label="Som">🔊</button>

<div id="banner"><span id="bannerText">FASE 2!</span></div>

<div id="menu" class="overlay">
  <div class="top" style="text-align:center">
    <h1>Ache o Tatu!</h1>
    <p>Toque na cabeça do tatu quando ele sair do buraquinho! 🐾</p>
  </div>
  <button id="play">▶ JOGAR</button>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   CANVAS / LAYOUT
   ============================================================ */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

const ptsEl      = document.getElementById('pts');
const lvlEl      = document.getElementById('lvl');
const menuEl     = document.getElementById('menu');
const bannerEl   = document.getElementById('banner');
const bannerText = document.getElementById('bannerText');
const soundBtn   = document.getElementById('sound');

let W = 0, H = 0, DPR = 1, unit = 1, groundTop = 0;
let holes = [];
let bannerTimer = null;

/* ============================================================
   ESTADO DO JOGO
   ============================================================ */
const G = {
  state: 'menu',
  activeIdx: -1,
  lastIdx: -1,
  flip: 1,
  rise: 0,
  timer: 0,
  t: 0,
  score: 0,
  level: 1,
  parts: [],
  floats: [],
  hitPulse: 0,
  blink: 0,
  blinkNext: 2,
  menuBob: 0
};

/* ============================================================
   ÁUDIO
   ============================================================ */
let actx = null;
let muted = false;

function audioInit(){
  if(!actx){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) actx = new AC();
    }catch(e){ actx = null; }
  }
  if(actx && actx.state === 'suspended') actx.resume();
}

function tone(freq, delay, dur, type, vol, freq2){
  if(!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if(freq2) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq2), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

function sndRise(){ tone(200, 0, 0.20, 'sine', 0.16, 560); }
function sndDown(){ tone(380, 0, 0.16, 'sine', 0.10, 160); }
function sndHit(){
  tone(784,  0.00, 0.12, 'triangle', 0.22);
  tone(988,  0.07, 0.12, 'triangle', 0.20);
  tone(1319, 0.14, 0.24, 'triangle', 0.20);
}
function sndLevel(){
  tone(523, 0.28, 0.15, 'sine', 0.20);
  tone(659, 0.40, 0.15, 'sine', 0.20);
  tone(784, 0.52, 0.32, 'sine', 0.20);
}
function sndMiss(){ tone(180, 0, 0.09, 'sine', 0.07, 120); }

/* ============================================================
   RESIZE / LAYOUT
   ============================================================ */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}

function layout(){
  groundTop = Math.round(H * 0.46);
  const band = H - groundTop;

  unit = Math.min(W / 720, H / 720);
  unit = Math.max(0.42, Math.min(unit, 1.6));

  const defs = [
    { t: 0.12, xs: [0.18, 0.50, 0.82],        f: 0.78 },
    { t: 0.42, xs: [0.10, 0.36, 0.64, 0.90],  f: 0.94 },
    { t: 0.76, xs: [0.22, 0.55, 0.80],        f: 1.10 }
  ];

  holes = [];
  for(const d of defs){
    for(const fx of d.xs){
      holes.push({
        x: W * fx,
        y: groundTop + band * d.t,
        s: unit * d.f
      });
    }
  }
}

/* ============================================================
   TEMPOS
   ============================================================ */
function riseDur(){ return Math.max(0.16, 0.42 - (G.level - 1) * 0.020); }
function upDur(){   return Math.max(0.85, 2.60 - (G.level - 1) * 0.160); }
function downDur(){ return Math.max(0.14, 0.35 - (G.level - 1) * 0.015); }
function waitDur(){ return Math.max(0.12, 0.55 - (G.level - 1) * 0.040); }

/* ============================================================
   LÓGICA
   ============================================================ */
function startGame(){
  G.state = 'wait';
  G.activeIdx = -1;
  G.lastIdx = -1;
  G.rise = 0;
  G.timer = 0.55;
  G.score = 0;
  G.level = 1;
  G.parts.length = 0;
  G.floats.length = 0;
  G.hitPulse = 0;
  ptsEl.textContent = '0';
  lvlEl.textContent = '1';
  menuEl.classList.add('hide');
}

function appear(){
  let idx;
  let guard = 0;
  do {
    idx = Math.floor(Math.random() * holes.length);
    guard++;
  } while(holes.length > 1 && idx === G.lastIdx && guard < 30);

  G.lastIdx   = idx;
  G.activeIdx = idx;
  G.flip      = Math.random() < 0.5 ? -1 : 1;
  G.rise      = 0;
  G.state     = 'rising';

  const h = holes[idx];
  spawnDirt(h.x, h.y - 4 * h.s, 8);
  sndRise();
}

function hitArmadillo(hx, hy, h){
  G.score++;
  G.hitPulse = 0.4;
  ptsEl.textContent = G.score;

  spawnStars(hx, hy);
  G.floats.push({ x: hx, y: hy - 24, life: 0.95, max: 0.95, text: '+1' });
  sndHit();

  const newLevel = Math.min(12, 1 + Math.floor(G.score / 5));
  if(newLevel > G.level){
    G.level = newLevel;
    lvlEl.textContent = newLevel;
    showBanner(newLevel);
    sndLevel();
  }

  G.state = 'down';
}

function showBanner(level){
  bannerText.textContent = 'FASE ' + level + '!';
  bannerEl.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => bannerEl.classList.remove('show'), 1400);
}

/* ============================================================
   PARTÍCULAS
   ============================================================ */
function spawnDirt(x, y, n){
  for(let i = 0; i < n; i++){
    const a  = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
    const sp = 70 + Math.random() * 140;
    G.parts.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      g: 620,
      life: 0.55 + Math.random() * 0.25,
      max: 0.8,
      r: 3 + Math.random() * 4,
      c: Math.random() < 0.5 ? '#8a5730' : '#a9743f'
    });
  }
}

function spawnDust(x, y){
  for(let i = 0; i < 6; i++){
    const a  = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 70;
    G.parts.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 20,
      g: 300,
      life: 0.35,
      max: 0.35,
      r: 4 + Math.random() * 4,
      c: 'rgba(200,180,150,0.9)'
    });
  }
}

function spawnStars(x, y){
  const cores = ['#ffd93d', '#ff8fab', '#7ae582', '#8ecae6', '#ffb703'];
  for(let i = 0; i < 16; i++){
    const a  = Math.random() * Math.PI * 2;
    const sp = 90 + Math.random() * 200;
    G.parts.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 90,
      g: 300,
      life: 0.85,
      max: 0.85,
      r: 6 + Math.random() * 7,
      c: cores[i % cores.length],
      star: true,
      rot: Math.random() * 6
    });
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  G.t += dt;

  G.blinkNext -= dt;
  if(G.blinkNext <= 0){ G.blink = 0.12; G.blinkNext = 1.8 + Math.random() * 3; }
  if(G.blink > 0) G.blink -= dt;
  if(G.hitPulse > 0) G.hitPulse -= dt;
  G.menuBob += dt;

  switch(G.state){
    case 'wait':
      G.timer -= dt;
      if(G.timer <= 0) appear();
      break;

    case 'rising':
      G.rise += dt / riseDur();
      if(G.rise >= 1){ G.rise = 1; G.state = 'up'; G.timer = upDur(); }
      break;

    case 'up':
      G.timer -= dt;
      if(G.timer <= 0){ G.state = 'down'; sndDown(); }
      break;

    case 'down':
      G.rise -= dt / downDur();
      if(G.rise <= 0){
        G.rise = 0;
        G.state = 'wait';
        G.timer = waitDur();
        G.activeIdx = -1;
      }
      break;
  }

  for(let i = G.parts.length - 1; i >= 0; i--){
    const p = G.parts[i];
    p.life -= dt;
    if(p.life <= 0){ G.parts.splice(i, 1); continue; }
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.99;
    if(p.rot !== undefined) p.rot += dt * 6;
  }

  for(let i = G.floats.length - 1; i >= 0; i--){
    const f = G.floats[i];
    f.life -= dt;
    f.y -= 70 * dt;
    if(f.life <= 0) G.floats.splice(i, 1);
  }
}

/* ============================================================
   DESENHO — HELPERS
   ============================================================ */
function ell(x, y, rx, ry, rot){
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawStarPath(cx, cy, R, r, n){
  ctx.beginPath();
  for(let i = 0; i < n * 2; i++){
    const rad = (i % 2 === 0) ? R : r;
    const a = -Math.PI / 2 + i * Math.PI / n;
    const x = cx + Math.cos(a) * rad;
    const y = cy + Math.sin(a) * rad;
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

/* ============================================================
   DESENHO — CENÁRIO
   ============================================================ */
function cloud(x, y, r){
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath();
  ctx.arc(x,             y,             r * 1.00, 0, 7);
  ctx.arc(x + r * 0.92,  y + r * 0.16,  r * 0.74, 0, 7);
  ctx.arc(x - r * 0.92,  y + r * 0.20,  r * 0.66, 0, 7);
  ctx.arc(x + r * 0.18,  y - r * 0.52,  r * 0.70, 0, 7);
  ctx.fill();
}

function drawBackground(){
  const sky = ctx.createLinearGradient(0, 0, 0, groundTop + 12);
  sky.addColorStop(0, '#7ec8f2');
  sky.addColorStop(1, '#d3efff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, groundTop + 12);

  ctx.fillStyle = 'rgba(255,240,150,.45)';
  ctx.beginPath(); ctx.arc(W * 0.85, H * 0.10, 72 * unit, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffe066';
  ctx.beginPath(); ctx.arc(W * 0.85, H * 0.10, 46 * unit, 0, 7); ctx.fill();

  cloud(W * 0.16, H * 0.13, 30 * unit);
  cloud(W * 0.52, H * 0.07, 22 * unit);
  cloud(W * 0.72, H * 0.22, 16 * unit);

  const gnd = ctx.createLinearGradient(0, groundTop, 0, H);
  gnd.addColorStop(0,    '#c08a52');
  gnd.addColorStop(0.35, '#a9743f');
  gnd.addColorStop(1,    '#7a4e27');
  ctx.fillStyle = gnd;
  ctx.fillRect(0, groundTop, W, H - groundTop);

  ctx.fillStyle = '#6dbb4e';
  ctx.fillRect(0, groundTop, W, 16 * unit);
  for(let x = 0; x < W + 30 * unit; x += 26 * unit){
    ctx.beginPath();
    ctx.arc(x + 13 * unit, groundTop + 2 * unit, 13 * unit, Math.PI, 0);
    ctx.fill();
  }

  ctx.fillStyle = '#5aa93e';
  for(let x = 10 * unit; x < W; x += 60 * unit){
    ctx.beginPath();
    ctx.moveTo(x,                groundTop + 16 * unit);
    ctx.lineTo(x + 5 * unit,     groundTop - 6 * unit);
    ctx.lineTo(x + 10 * unit,    groundTop + 16 * unit);
    ctx.fill();
  }
}

/* ============================================================
   DESENHO — BURACO
   ============================================================ */
function drawHole(h, front){
  const s = h.s;
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.scale(s, s);

  if(!front){
    ctx.fillStyle = '#9a6437';
    ctx.beginPath(); ctx.ellipse(0, 0, 70, 26, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a5730';
    ctx.beginPath(); ctx.ellipse(0, 5, 66, 22, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#4a2c14';
    ctx.beginPath(); ctx.ellipse(0, -2, 46, 17, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b1809';
    ctx.beginPath(); ctx.ellipse(0, -1, 36, 12, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#8a5730';
    ctx.beginPath(); ctx.ellipse(0, 5, 66, 22, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#4a2c14';
    ctx.beginPath(); ctx.ellipse(0, -2, 46, 17, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#2b1809';
    ctx.beginPath(); ctx.ellipse(0, -1, 36, 12, 0, 0, Math.PI); ctx.fill();
  }

  ctx.restore();
}

/* ============================================================
   DESENHO — TATU
   ============================================================ */
function drawTatu(){
  const happy = G.hitPulse > 0;

  ctx.fillStyle = '#d8a86f';
  ell(-38, -10, 17, 11);
  ell( 30, -10, 17, 11);

  ctx.fillStyle = '#c08a52';
  ctx.beginPath();
  ctx.ellipse(-70, -26, 18, 11, -0.35, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#b07a45';
  ell(0, -52, 62, 48);
  ctx.fillStyle = '#c99259';
  ell(-4, -58, 52, 38);

  ctx.strokeStyle = '#8f5f30';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  for(const bx of [-34, -12, 10, 32]){
    const k  = Math.sqrt(Math.max(0, 1 - (bx / 62) * (bx / 62)));
    const y0 = -52 - 44 * k;
    const y1 = -52 + 44 * k;
    ctx.beginPath();
    ctx.moveTo(bx, y0 + 6);
    ctx.quadraticCurveTo(bx + 11, -52, bx, y1 - 6);
    ctx.stroke();
  }

  ctx.fillStyle = '#d9ab7e';
  ell(40, -74, 11, 11);

  ctx.fillStyle = '#e9c39a';
  ell(58, -48, 32, 30);

  ctx.fillStyle = '#eecfa8';
  ell(92, -42, 24, 16);

  ctx.fillStyle = '#4a2f1c';
  ell(108, -46, 8, 7);

  ctx.fillStyle = 'rgba(255,120,120,.35)';
  ell(48, -34, 11, 8);

  if(happy){
    ctx.strokeStyle = '#2a1a0e';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(66, -58, 11, Math.PI * 1.12, Math.PI * 1.88);
    ctx.stroke();
  } else if(G.blink > 0){
    ctx.strokeStyle = '#2a1a0e';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(56, -59);
    ctx.lineTo(76, -59);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#ffffff';
    ell(66, -59, 13, 13);
    ctx.fillStyle = '#2a1a0e';
    ell(69, -59, 7, 7);
    ctx.fillStyle = '#ffffff';
    ell(72, -62, 2.8, 2.8);
  }
}

/* rise = 0 → escondido na terra (abaixo do buraco)
   rise = 1 → fora do buraco  */
function drawArmadillo(cx, baseY, s, rise, flip){
  const HMAX = 115;
  const yy = baseY + (1 - rise) * HMAX * s;
  ctx.save();
  ctx.translate(cx, yy);
  ctx.scale(s * flip, s);
  drawTatu();
  ctx.restore();
}

/* ============================================================
   DESENHO — PARTÍCULAS / TEXTOS
   ============================================================ */
function drawParticles(){
  for(const p of G.parts){
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    if(p.star){
      drawStarPath(p.x, p.y, p.r, p.r * 0.45, 5);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFloats(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const f of G.floats){
    const a = Math.max(0, f.life / f.max);
    ctx.globalAlpha = a;
    ctx.font = '900 ' + Math.round(46 * unit) + 'px "Trebuchet MS", sans-serif';
    ctx.lineWidth = 7;
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = '#ff9f1c';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   RENDER PRINCIPAL — ✅ CORRIGIDO
   Todos os buracos são desenhados sempre.
   ============================================================ */
function render(){
  drawBackground();

  const activeIdx = G.activeIdx;
  const active    = (activeIdx >= 0) ? holes[activeIdx] : null;

  /* 1) Desenha TODOS os buracos, exceto o ativo */
  for(let i = 0; i < holes.length; i++){
    if(i === activeIdx) continue;
    drawHole(holes[i], false);
  }

  /* 2) Buraco ativo + tatu saindo de dentro da terra */
  if(active){
    drawHole(active, false);

    if(G.rise > 0.001){
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, active.y - 3 * active.s);
      ctx.clip();
      drawArmadillo(active.x, active.y, active.s, G.rise, G.flip);
      ctx.restore();
    }

    /* borda da frente cobre a base do tatu */
    drawHole(active, true);
  }

  /* tatu do menu */
  if(G.state === 'menu'){
    const s = unit * 1.7;
    const bob = Math.sin(G.menuBob * 2.2) * 6;
    ctx.save();
    ctx.translate(W / 2, H * 0.66 + bob);
    ctx.scale(s, s);
    drawTatu();
    ctx.restore();
  }

  drawParticles();
  drawFloats();
}

/* ============================================================
   LOOP
   ============================================================ */
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0)    dt = 0;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

/* ============================================================
   INTERAÇÃO
   ============================================================ */
function handleTap(x, y){
  audioInit();

  if(G.state === 'menu') return;

  if(G.activeIdx >= 0 && (G.state === 'up' || G.state === 'rising')){
    const h  = holes[G.activeIdx];
    const hx = h.x + 58 * h.s * G.flip;
    const hy = h.y + (1 - G.rise) * 115 * h.s - 48 * h.s;
    const R  = Math.max(75, 95 * h.s);

    const dx = x - hx;
    const dy = y - hy;

    if(dx * dx + dy * dy < R * R){
      hitArmadillo(hx, hy, h);
      return;
    }
  }

  spawnDust(x, y);
  sndMiss();
}

canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  handleTap(e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

/* ============================================================
   BOTÕES
   ============================================================ */
document.getElementById('play').addEventListener('click', function(e){
  e.preventDefault();
  audioInit();
  startGame();
});

soundBtn.addEventListener('click', function(e){
  e.preventDefault();
  muted = !muted;
  soundBtn.textContent = muted ? '🔇' : '🔊';
  if(!muted) audioInit();
});

/* ============================================================
   INÍCIO
   ============================================================ */
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){
  setTimeout(resize, 220);
});

resize();
requestAnimationFrame(function(t){
  last = t;
  requestAnimationFrame(loop);
});

})();
</script>
